services:
  cube:
    image: cubejs/cube:v1.5
    platform: linux/amd64
    container_name: cube-semantic-layer
    ports:
      - "4000:4000"   # Playground / REST & GraphQL API
      - "15432:15432" # Postgres-compatible SQL API
    env_file:
      - .env
      - .env.runtime # generated by ./fetch-secrets.sh, holds CUBEJS_AWS_KEY/SECRET from Secrets Manager
    volumes:
      - ./model:/cube/conf/model
      - ./cube.js:/cube/conf/cube.js
      - ./.cubestore:/cube/conf/.cubestore

  metabase-db:
    image: postgres:15
    container_name: cube-metabase-db
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase
    volumes:
      - metabase-db-data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:v0.49.8
    container_name: cube-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
    depends_on:
      - cube
      - metabase-db

volumes:
  metabase-db-data:

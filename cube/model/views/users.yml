  views:
  - name: users
    description: >
      Migrated from users.lkml (explore: users) - mainly for new users charts.
      Joins user_last_properties, user_profiles, user_last_optional_consent_status,
      new_user_activation, new_user_retention, adjust_attribution and (via
      user_last_properties) market_mapping and apple_device_mapping. Explore joins
      to views not yet migrated to cubes are left out.

    # Cube's field marked public:false alone isn't enough to keep a field out of BI tools
    # connected via the SQL API. It also has to be excluded from the view.
    cubes:
      - join_path: users_base
        includes: "*"
        prefix: true

      - join_path: users_base.user_last_properties
        includes: "*"
        prefix: true
        excludes:
          - analytics_id

      - join_path: users_base.user_profiles
        includes: "*"
        prefix: true
        excludes:
          - analytics_id

      - join_path: users_base.user_last_optional_consent_status
        includes: "*"
        prefix: true
        excludes:
          - analytics_id
          - consent_health_analytics_revoke_at
          - consent_product_promotion_revoke_at
          - consent_scientific_research_revoke_at
          - consent_usage_analytics_revoke_at
          - consent_usage_marketing_revoke_at
          - created_by_task
          - created_execution_at
          - etl_created_at
          - etl_updated_at

      - join_path: users_base.new_user_activation
        includes: "*"
        prefix: true
        excludes:
          - analytics_id
          - days_since_account_created

      - join_path: users_base.new_user_retention
        includes: "*"
        prefix: true
        excludes:
          - analytics_id

      - join_path: users_base.adjust_attribution
        includes: "*"
        prefix: true
        excludes:
          - analytics_id

      - join_path: users_base.user_last_properties.market_mapping
        includes: "*"
        prefix: true

      - join_path: users_base.user_last_properties.apple_device_mapping
        includes: "*"
        prefix: true
        excludes:
          - model_identifier

      - join_path: users_base.user_goal_attributes
        includes: "*"
        prefix: true
        excludes:
          - analytics_id

      - join_path: users_base.braze_global_control_group
        includes: "*"
        prefix: true
        excludes:
          - analytics_id

    # No folders: the explore's view_labels aren't ported because folders only show in
    # Cube-native tools. Metabase reads this view over the SQL API as one flat table, so
    # fields are grouped by their join prefix (e.g. new_user_retention_*) instead.

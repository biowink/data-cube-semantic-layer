views:
  - name: sales
    description: >
      Migrated from sales.lkml (explore: subscriptions_events). Joins users,
      user_profiles, user_last_properties, crm_sales, paddle_discount_codes,
      adjust_attribution, user_last_optional_consent_status and (via
      user_last_properties) market_mapping.

    cubes:
      - join_path: subscriptions_events
        includes: "*"

      - join_path: subscriptions_events.users
        includes: "*"
        prefix: true

      - join_path: subscriptions_events.user_profiles
        includes: "*"
        prefix: true

      - join_path: subscriptions_events.user_last_properties
        includes: "*"
        prefix: true

      - join_path: subscriptions_events.user_last_properties.market_mapping
        includes: "*"
        prefix: true

      - join_path: subscriptions_events.crm_sales
        includes: "*"
        prefix: true

      - join_path: subscriptions_events.paddle_discount_codes
        includes: "*"
        prefix: true

      - join_path: subscriptions_events.adjust_attribution
        includes: "*"
        prefix: true

      - join_path: subscriptions_events.user_last_optional_consent_status
        includes: "*"
        prefix: true
views:
  - name: events
    title: Events

    cubes:
      - join_path: events_base
        includes: "*"

      - join_path: users
        includes: "*"
        prefix: true

      - join_path: users.user_last_properties
        includes: "*"
        prefix: true
        excludes:
          - analytics_id

      - join_path: users.user_profiles
        includes: "*"
        prefix: true
        excludes:
          - analytics_id

      - join_path: users.user_last_optional_consent_status
        includes: "*"
        prefix: true
        excludes:
          - analytics_id
          - consent_health_analytics_revoke_at
          - consent_product_promotion_revoke_at
          - consent_scientific_research_revoke_at
          - consent_usage_analytics_revoke_at
          - consent_usage_marketing_revoke_at
          - created_by_task
          - created_execution_at
          - etl_created_at
          - etl_updated_at

views:
  - name: subscriber_activity_retention
    title: "Subscriber Activity Retention"
    description: "This explore shows how many months 12m subscribers were active after subscribing. Equivalent of the subscriber_activity_retention explore in models/app_usage.model.lkml"

    # Joined cubes are prefixed with their cube name: several share member names
    # (country/market on user_last_properties and market_mapping), which Looker
    # kept apart by view name.
    cubes:
      - join_path: subscriber_activity_retention_base
        includes: "*"

      # view_label: "Users"
      - join_path: subscriber_activity_retention_base.users_base
        prefix: true
        includes: "*"
        excludes:
          - analytics_id

      - join_path: subscriber_activity_retention_base.user_last_properties
        prefix: true
        includes: "*"
        excludes:
          - analytics_id

      # Cubes not in this repo yet; the view won't compile until they exist
      - join_path: subscriber_activity_retention_base.user_last_optional_consent_status
        prefix: true
        includes: "*"
        excludes:
          - analytics_id
          - consent_health_analytics_revoke_at
          - consent_product_promotion_revoke_at
          - consent_scientific_research_revoke_at
          - consent_usage_analytics_revoke_at
          - consent_usage_marketing_revoke_at
          - created_by_task
          - created_execution_at
          - etl_created_at
          - etl_updated_at

      - join_path: subscriber_activity_retention_base.braze_global_control_group
        prefix: true
        includes: "*"
        excludes:
          - analytics_id

      # view_label: "Market & Region"
      - join_path: subscriber_activity_retention_base.user_last_properties.market_mapping
        prefix: true
        includes:
          - country
          - market
          - region

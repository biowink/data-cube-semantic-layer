      - name: track_sex_life
        sql: "{CUBE}.track_sex_life"
        type: boolean

      - name: track_feelings
        sql: "{CUBE}.track_feelings"
        type: boolean

      - name: track_energy
        sql: "{CUBE}.track_energy"
        type: boolean

      - name: track_pms
        title: "Track PMS"
        sql: "{CUBE}.track_pms"
        type: boolean
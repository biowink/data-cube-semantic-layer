      - name: goal_understand_body
        title: "Understand My Body"
        sql: "{CUBE}.goal_understand_body"
        type: boolean

      - name: goal_track_symptoms
        title: "Track Symptoms"
        sql: "{CUBE}.goal_track_symptoms"

      - name: goal_gather_symptoms
        title: "Gather Symptoms"
        sql: "{CUBE}.goal_gather_symptoms"
        type: boolean

      - name: goal_conceive
        title: "Conceive"
        sql: "{CUBE}.goal_conceive"
        type: boolean

      - name: goal_pregnancy
        title: "Pregnancy"
        sql: "{CUBE}.goal_pregnancy"
        type: boolean

      - name: goal_perimenopause
        title: "Perimenopause"
        sql: "{CUBE}.goal_perimenopause"
        type: boolean

      - name: goal_none_of_the_above
        title: "None Of The Above"
        sql: "{CUBE}.goal_none_of_the_above"

        sql: "{CUBE}.analytics_id"
        type: string
        primary_key: true
        public: false

      - name: count_goals_selected
        sql: "{CUBE}.count_goals_selected"
        type: number

      - name: goal_predict_period
        title: "Predict Period"
        sql: "{CUBE}.goal_predict_period"

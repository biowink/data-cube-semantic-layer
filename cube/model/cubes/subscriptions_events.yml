cubes:
  - name: subscriptions_events
    sql_table: der.all_subscriptions_events
    description: "Migrated from views/sales/subscriptions_events.view.lkml"

    joins:
      - name: users
        relationship: many_to_one
        sql: "{CUBE}.analytics_id = {users.analytics_id}"

      - name: paddle_discount_codes
        relationship: many_to_one
        sql: "{CUBE}.code = {paddle_discount_codes.code}"

      - name: user_profiles
        relationship: many_to_one
        sql: "{CUBE}.analytics_id = {user_profiles.analytics_id}"

      - name: user_last_properties
        relationship: many_to_one
        sql: "{CUBE}.analytics_id = {user_last_properties.analytics_id}"

      - name: crm_sales
        relationship: many_to_one
        sql: "{CUBE}.backend_created_at >= {crm_sales.start_time} AND {CUBE}.backend_created_at < {crm_sales.end_time}"

      - name: user_last_optional_consent_status
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {user_last_optional_consent_status.analytics_id}"

      - name: adjust_attribution
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {adjust_attribution.analytics_id}"

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true

      - name: transaction_id
        sql: transaction_id
        type: string

      - name: analytics_id
        sql: analytics_id
        type: string

      # dimension_group: backend_created -> base time dim + the timeframes Cube can't
      # derive at query time (day_of_week/day_of_month/day_of_year/week_of_year/month_name)
      - name: backend_created_at
        sql: backend_created_at
        type: time

      - name: backend_created_day_of_week
        sql: "date_format({CUBE}.backend_created_at, '%A')"
        type: string

      - name: backend_created_day_of_month
        sql: "day_of_month({CUBE}.backend_created_at)"
        type: number

      - name: backend_created_day_of_year
        sql: "day_of_year({CUBE}.backend_created_at)"
        type: number

      - name: backend_created_week_of_year
        sql: "week({CUBE}.backend_created_at)"
        type: number

      - name: backend_created_month_name
        sql: "date_format({CUBE}.backend_created_at, '%M')"
        type: string

      # helper: day-truncated version, needed by the duration dimensions below
      - name: backend_created_date
        sql: "DATE_TRUNC('day', {CUBE}.backend_created_at)"
        type: time

      - name: country
        sql: country
        type: string
        meta:
          group_label: Market
        # map_layer_name: countries has no Cube equivalent (Looker geo viz feature)

      - name: strategic_market
        sql: >
          CASE WHEN {CUBE}.country IN (
            'United States','Australia','Canada','Japan','New Zealand','Austria',
            'Belgium','Denmark','France','Germany','Ireland','Luxembourg',
            'Netherlands','Norway','Sweden','Switzerland','United Kingdom','Italy','Spain'
          ) THEN true ELSE false END
        type: boolean
        meta:
          group_label: Market

      - name: currency_exchange_rate
        sql: currency_exchange_rate
        type: number

      - name: customer_currency
        sql: currency
        type: string
        description: >
          In most countries this is the price the user sees in the app store. In the US
          taxes will come on top of this value, so the user see a higher price than this.

      - name: customer_price
        sql: customer_price
        type: number

      # dimension_group: started
      - name: started_at
        sql: started_at
        type: time

      - name: started_date
        sql: "DATE_TRUNC('day', {CUBE}.started_at)"
        type: time

      # dimension_group: expires
      - name: expires_at
        sql: expires_at
        type: time

      - name: expires_date
        sql: "DATE_TRUNC('day', {CUBE}.expires_at)"
        type: time

      - name: subscription_id
        sql: subscription_id
        type: string

      - name: original_subscription_type
        sql: original_subscription_type
        type: string
        meta:
          group_label: "Subscription Type"

      - name: subscription_type
        sql: subscription_type
        type: string
        meta:
          group_label: "Subscription Type"

      - name: is_in_intro_offer_period
        sql: is_in_intro_offer_period
        type: boolean
        meta:
          group_label: "Subscription Type"

      - name: is_reactivation
        sql: reactivation
        type: boolean
        meta:
          group_label: "Subscription Type"

      # event_type_with_reactivations: case -> CASE. Original LookML referenced the bare
      # columns `reactivation` / `subscription_type` rather than ${is_reactivation} etc,
      # so this mirrors that with direct column refs.
      - name: event_type_with_reactivations
        sql: >
          CASE
            WHEN {CUBE}.reactivation THEN 'Reactivation'
            WHEN {CUBE}.subscription_type = 'Subscription Purchased' THEN 'Purchase'
            WHEN {CUBE}.subscription_type = 'Subscription Payable Action' THEN 'Payable Action'
            WHEN {CUBE}.subscription_type = 'Subscription Renewed' THEN 'Renewal'
            WHEN {CUBE}.subscription_type = 'Subscription Refunded' THEN 'Refund'
            WHEN {CUBE}.subscription_type = 'Subscription Free Trial' THEN 'Free Trial'
            WHEN {CUBE}.subscription_type = 'Subscription Canceled' THEN 'Cancelled'
          END
        type: string
        meta:
          group_label: "Subscription Type"

      - name: is_financial_transaction
        sql: is_financial_transaction
        type: boolean
        description: "Filters to events that indicate actual revenue flows (Purchases, Renewals, Refunds, and Payable Actions)"
        meta:
          group_label: "Subscription Type"

      - name: is_voucher_transaction
        sql: "COALESCE(REGEXP_LIKE({CUBE}.code, '^[A-Za-z0-9]{{3}}-[A-Za-z0-9]{{3}}-[A-Za-z0-9]{{3}}$'), FALSE)"
        type: boolean
        description: "Filters to events associated with backend vouchers"
        meta:
          group_label: "Subscription Type"

      - name: days_to_reactivation
        sql: days_to_reactivation
        type: number

      - name: platform
        sql: platform
        type: string

      - name: product_id
        sql: product_id
        type: string

      - name: subscription_duration
        sql: subscription_duration
        type: number

      - name: partner
        sql: "CASE WHEN {CUBE}.code_tags LIKE '%oura%' THEN 'oura' ELSE {CUBE}.partner END"
        type: string
        meta:
          group_label: "Subscription Source"

      - name: subpartner
        sql: subpartner
        type: string
        meta:
          group_label: "Subscription Source"

      - name: is_partner_subscription
        sql: "{CUBE.partner} IS NOT NULL"
        type: boolean
        description: "Whether a subscription event is from a Partner subscription (i.e. Gympass)"
        meta:
          group_label: "Subscription Source"

      - name: partner_tier
        sql: partner_tier
        type: string
        meta:
          group_label: "Subscription Source"

      - name: campaign
        sql: campaign
        type: string
        meta:
          group_label: "Subscription Source"

      - name: subscription_source
        sql: subscription_source
        type: string
        description: "The source of a subscription event (mobile, web, partner)"
        meta:
          group_label: "Subscription Source"

      - name: subscription_source_with_partner
        sql: "COALESCE({CUBE.partner}, {CUBE}.subscription_source)"
        type: string
        description: "The source of a subscription event, augmented with partner information"
        meta:
          group_label: "Subscription Source"

      - name: payment_method
        sql: payment_method_type
        type: string

      - name: code
        sql: code
        type: string
        meta:
          group_label: "Vouchers & Codes"

      - name: discount_code_campaign
        sql: "{paddle_discount_codes.campaign}"
        type: string
        meta:
          group_label: "Vouchers & Codes"

      - name: discount_code_partner
        sql: "{paddle_discount_codes.partner}"
        type: string
        meta:
          group_label: "Vouchers & Codes"

      - name: discount_code_department
        sql: "{paddle_discount_codes.department}"
        type: string
        meta:
          group_label: "Vouchers & Codes"

      - name: code_type
        sql: code_type
        type: string
        meta:
          group_label: "Vouchers & Codes"

      - name: discount_rate
        sql: discount_rate
        type: number

      - name: code_tags
        sql: code_tags
        type: string
        meta:
          group_label: "Vouchers & Codes"

      - name: is_crowdfunding_voucher
        sql: "{CUBE}.code_tags LIKE '%crowdfunding%'"
        type: boolean
        meta:
          group_label: "Vouchers & Codes"

      - name: crowdfunding_tier
        sql: "NULLIF(SPLIT_PART({CUBE}.code_description, ':', 2), '')"
        type: string
        meta:
          group_label: "Vouchers & Codes"

      - name: current_code_redemptions
        sql: code_redeem_count
        type: number
        meta:
          group_label: "Vouchers & Codes"

      - name: max_redemptions
        sql: code_max_redeems
        type: number
        meta:
          group_label: "Vouchers & Codes"

      # parameter: selected_event / suggest_dimension / suggest_explore have no Cube
      # equivalent - they were Looker UI affordances (a filter-only field with a
      # suggestion list). Dropped; if needed client-side, apply the filter directly.

      - name: subscription_type_suggestion
        sql: subscription_type
        type: string
        public: false

#      - name: tax
#        sql: tax
#        type: number
#        public: false

      - name: tax_rate
        sql: tax_rate
        type: number
        meta:
          format: percent_2

      # --- duration dimension_groups -> DATE_DIFF per interval (Athena/Trino: DATE_DIFF('unit', start, end)) ---

      - name: days_since_account_created
        sql: "DATE_DIFF('day', {users.account_created_date}, {CUBE.backend_created_date})"
        type: number
      - name: weeks_since_account_created
        sql: "DATE_DIFF('week', {users.account_created_date}, {CUBE.backend_created_date})"
        type: number
      - name: months_since_account_created
        sql: "DATE_DIFF('month', {users.account_created_date}, {CUBE.backend_created_date})"
        type: number
      - name: quarters_since_account_created
        sql: "DATE_DIFF('quarter', {users.account_created_date}, {CUBE.backend_created_date})"
        type: number
      - name: years_since_account_created
        sql: "DATE_DIFF('year', {users.account_created_date}, {CUBE.backend_created_date})"
        type: number

      - name: days_start_to_created_at
        sql: "DATE_DIFF('day', {CUBE.started_date}, {CUBE.backend_created_date})"
        type: number
      - name: weeks_start_to_created_at
        sql: "DATE_DIFF('week', {CUBE.started_date}, {CUBE.backend_created_date})"
        type: number
      - name: months_start_to_created_at
        sql: "DATE_DIFF('month', {CUBE.started_date}, {CUBE.backend_created_date})"
        type: number
      - name: quarters_start_to_created_at
        sql: "DATE_DIFF('quarter', {CUBE.started_date}, {CUBE.backend_created_date})"
        type: number
      - name: years_start_to_created_at
        sql: "DATE_DIFF('year', {CUBE.started_date}, {CUBE.backend_created_date})"
        type: number

      - name: days_account_created_to_start
        sql: "DATE_DIFF('day', {users.account_created_date}, {CUBE.started_date})"
        type: number
      - name: weeks_account_created_to_start
        sql: "DATE_DIFF('week', {users.account_created_date}, {CUBE.started_date})"
        type: number
      - name: months_account_created_to_start
        sql: "DATE_DIFF('month', {users.account_created_date}, {CUBE.started_date})"
        type: number
      - name: quarters_account_created_to_start
        sql: "DATE_DIFF('quarter', {users.account_created_date}, {CUBE.started_date})"
        type: number
      - name: years_account_created_to_start
        sql: "DATE_DIFF('year', {users.account_created_date}, {CUBE.started_date})"
        type: number

      - name: days_start_to_expiration
        sql: "DATE_DIFF('day', {CUBE.started_date}, {CUBE.expires_date})"
        type: number
      - name: weeks_start_to_expiration
        sql: "DATE_DIFF('week', {CUBE.started_date}, {CUBE.expires_date})"
        type: number
      - name: months_start_to_expiration
        sql: "DATE_DIFF('month', {CUBE.started_date}, {CUBE.expires_date})"
        type: number
      - name: quarters_start_to_expiration
        sql: "DATE_DIFF('quarter', {CUBE.started_date}, {CUBE.expires_date})"
        type: number
      - name: years_start_to_expiration
        sql: "DATE_DIFF('year', {CUBE.started_date}, {CUBE.expires_date})"
        type: number

      - name: user_age_at_created_at
        sql: >
          CASE WHEN {CUBE.days_since_account_created} = 0 THEN 'D0'
               WHEN {CUBE.days_since_account_created} BETWEEN 1 AND 30 THEN 'D1-D30'
               ELSE 'D31+'
          END
        type: string
        meta:
          group_label: "User Age"

      - name: user_age_at_start
        sql: >
          CASE WHEN {CUBE.days_account_created_to_start} = 0 THEN 'D0'
               WHEN {CUBE.days_account_created_to_start} BETWEEN 1 AND 30 THEN 'D1-D30'
               ELSE 'D31+'
          END
        type: string
        meta:
          group_label: "User Age"

      # parameter: granularity_selector / dynamic_date_granularity dropped:
      # Cube lets a client request backend_created_at at any granularity
      # (day/week/month/quarter) per-query natively, so no schema field is needed.

      - name: gross_sales_euro_dim
        description: "This dimension is gross sales in Euros."
        sql: >
          CASE
            WHEN {CUBE.subscription_type} IN ('Subscription Purchased', 'Subscription Renewed', 'Subscription Payable Action')
              THEN {CUBE}.gross_sales_euro
            WHEN {CUBE.subscription_type} = 'Subscription Refunded'
              THEN -{CUBE}.gross_sales_euro
            ELSE 0
          END
        type: number
        meta:
          format: currency

      - name: sales_without_tax
        sql: >
          CASE
            WHEN {CUBE.subscription_type} IN ('Subscription Purchased', 'Subscription Renewed', 'Subscription Payable Action')
              THEN {CUBE}.sales_without_tax_euro
            WHEN {CUBE.subscription_type} = 'Subscription Refunded'
              THEN -{CUBE}.sales_without_tax_euro
            ELSE 0
          END
        type: number
        meta:
          format: currency

      - name: store_fee_rate
        sql: store_fee_rate
        type: number
        public: false

      # --- chloe's temporary columns ---

      - name: is_partner_or_discount_code_partner
        sql: "{CUBE.is_partner_subscription} OR {CUBE.discount_code_partner} IS NOT NULL"
        type: boolean
        meta:
          group_label: "Subscription Source"

      - name: partner_coalesce
        sql: >
          CASE WHEN {CUBE.subscription_source} = 'flex' THEN 'flex'
               ELSE COALESCE(LOWER({CUBE.partner}), LOWER({CUBE.discount_code_partner}))
          END
        type: string
        description: "Shows partner, then partner from voucher discount code metadata, then department if no partner exists."
        meta:
          group_label: "Subscription Source"

      - name: three_month_free_trial
        sql: >
          {CUBE.subscription_type} = 'Subscription Paddle Trial'
          OR ({CUBE.subscription_type} NOT IN ('Subscription Payable Action', 'Subscription Granted')
              AND {CUBE.partner} IS NOT NULL AND {CUBE.partner} NOT IN ('gympass', 'klarna')
              AND ({CUBE.code} IS NULL OR {CUBE.code} = 'BANNER25'))
        type: boolean
        meta:
          group_label: "Subscription Source"

      - name: redemption_type
        sql: >
          CASE WHEN {CUBE.partner_coalesce} IN ('klarna', 'gympass', 'usc', 'mondia', 'Mondia')
                 THEN 'Integration'
               WHEN {CUBE.three_month_free_trial} THEN '3 Month Free Trial'
               WHEN {CUBE.code_type} = 'voucher' AND {CUBE.subscription_source} = 'partner'
                 THEN 'Reseller Voucher Code'
               WHEN {CUBE.code_type} = 'voucher' AND {CUBE.subscription_source} = 'clue_voucher'
                 THEN 'Clue Voucher Code'
               WHEN {CUBE.code_type} = 'web_discount' THEN 'Web Discount Code'
               WHEN {CUBE.subscription_source} = 'web' THEN 'Standard Web Purchase'
               WHEN {CUBE.subscription_source} = 'flex' THEN 'Flex'
               ELSE 'Standard Purchase'
          END
        type: string
        meta:
          group_label: "Subscription Source"

      - name: campaign_coalesce
        sql: "COALESCE({CUBE.campaign}, {CUBE.discount_code_campaign})"
        type: string
        meta:
          group_label: "Subscription Source"

    measures:
      - name: gross_sales_euro
        sql: "{CUBE.gross_sales_euro_dim}"
        type: sum
        format: currency
        drill_members: [platform, country, transaction_id, user_last_properties.market]

      - name: sales_without_tax_euro
        sql: "{CUBE.sales_without_tax}"
        type: sum
        format: currency

      - name: net_sales_euro
        sql: >
          CASE
            WHEN {CUBE.subscription_type} IN ('Subscription Purchased', 'Subscription Renewed', 'Subscription Payable Action')
              THEN {CUBE}.net_sales_euro
            WHEN {CUBE.subscription_type} = 'Subscription Refunded'
              THEN -{CUBE}.net_sales_euro
            ELSE 0
          END
        type: sum
        format: currency

      - name: tax_euro
        sql: >
          CASE
            WHEN {CUBE.subscription_type} IN ('Subscription Purchased', 'Subscription Renewed', 'Subscription Payable Action')
              THEN {CUBE}.tax_euro
            WHEN {CUBE.subscription_type} = 'Subscription Refunded'
              THEN -{CUBE}.tax_euro
            ELSE 0
          END
        type: sum
        format: currency

      - name: store_fee_euro
        sql: >
          CASE
            WHEN {CUBE.subscription_type} IN ('Subscription Purchased', 'Subscription Renewed', 'Subscription Payable Action')
              THEN {CUBE}.store_fee_euro
            WHEN {CUBE.subscription_type} = 'Subscription Refunded'
              THEN -{CUBE}.store_fee_euro
            ELSE 0
          END
        type: sum
        format: currency

      - name: user_count
        sql: analytics_id
        type: count_distinct

      - name: transaction_count
        title: "Transaction Count (aka Subscribers)"
        sql: "CASE WHEN {CUBE.subscription_type} = 'Subscription Refunded' THEN -1 ELSE 1 END"
        type: sum
        drill_members: [subscription_type, transaction_id, user_last_properties.market]

      - name: average_tax_rate
        sql: tax_rate
        type: avg
        meta:
          format: percent_2

      - name: average_gross_price_eur
        sql: "{gross_sales_euro} / NULLIF({transaction_count}, 0)"
        type: number
        format: currency

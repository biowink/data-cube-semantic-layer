cubes:
  - name: google_ads_creative_performance
    sql_table: der.google_ads_creative_performance
    description: "Migrated from views/adjust/google_ads_creative_performance.view.lkml"

    # The source LookML view defines no primary key, so none is set here either.
    # Add one before joining this cube to others.

    dimensions:
      # dimension_group: date (raw, date, week, month, quarter, year) - all native
      # Cube granularities. Source is a DATE column with convert_tz: no.
      - name: date
        sql: "{CUBE}.date"
        type: time

      - name: campaign_id
        sql: campaign_id
        type: string

      - name: campaign_name
        sql: campaign_name
        type: string

      - name: ad_group_id
        sql: ad_group_id
        type: string

      - name: ad_group_name
        sql: ad_group_name
        type: string

      - name: asset_type
        sql: "LOWER({CUBE}.asset_type)"
        type: string

      - name: asset_orientation
        sql: "LOWER({CUBE}.asset_orientation)"
        type: string

      - name: image_asset_id
        sql: image_asset_id
        type: string

      - name: image_asset_name
        sql: image_asset_name
        type: string

      - name: text_asset_text
        sql: text_asset_text
        type: string

      - name: video_asset_id
        sql: video_asset_id
        type: string

      - name: video_asset_name
        sql: video_asset_name
        type: string

      - name: asset_name
        sql: "COALESCE({CUBE}.text_asset_text, {CUBE}.video_asset_name, {CUBE}.image_asset_name)"
        type: string

    measures:
      - name: count
        type: count
        public: false

      - name: total_cost
        sql: cost
        type: sum

      - name: total_impressions
        sql: impressions
        type: sum

      - name: total_clicks
        sql: clicks
        type: sum

      - name: total_conversions
        sql: conversions
        type: sum

      - name: total_view_through_conversions
        sql: view_through_conversions
        type: sum

      - name: total_video_trueview_views
        sql: video_trueview_views
        type: sum

      # Calculated measures (rates & performance)
      - name: click_through_rate
        title: "CTR"
        description: "Clicks / Impressions"
        sql: "CASE WHEN {total_impressions} > 0 THEN CAST({total_clicks} AS DOUBLE) / {total_impressions} ELSE 0 END"
        type: number

      - name: cost_per_thousand_impressions
        title: "CPM"
        description: "Cost per 1000 Impressions"
        sql: "CASE WHEN {total_impressions} > 0 THEN 1000 * {total_cost} / {total_impressions} ELSE 0 END"
        type: number

      - name: cost_per_click
        title: "CPC"
        description: "Cost per Click"
        sql: "CASE WHEN {total_clicks} > 0 THEN {total_cost} / {total_clicks} ELSE 0 END"
        type: number

      - name: cost_per_conversion
        title: "Cost per Conversion"
        description: "Cost per Conversion"
        sql: "CASE WHEN {total_conversions} > 0 THEN {total_cost} / {total_conversions} ELSE 0 END"
        type: number

      - name: video_trueview_view_rate
        sql: "CASE WHEN {total_impressions} > 0 THEN CAST({total_video_trueview_views} AS DOUBLE) / {total_impressions} ELSE 0 END"
        type: number

cubes:
  - name: google_play_store_transactions
    sql_table: der.google_play_sales
    description: "Migrated from views/data_monitoring/google_play_store_transactions.view.lkml"

    dimensions:
      - name: base_plan_id
        sql: base_plan_id
        type: string

      - name: charged_amount
        sql: charged_amount
        type: number

      - name: city_of_buyer
        sql: city_of_buyer
        type: string

      - name: country_of_buyer
        sql: country_of_buyer
        type: string

      - name: coupon_value
        sql: coupon_value
        type: string

      - name: currency_of_sale
        sql: currency_of_sale
        type: string

      - name: device_model
        sql: device_model
        type: string

      - name: discount_rate
        sql: discount_rate
        type: string

      - name: financial_status
        sql: financial_status
        type: string

      - name: first_usd_1m_eligible
        sql: first_usd_1m_eligible
        type: string

      - name: group_id
        sql: group_id
        type: string

      - name: item_price
        sql: item_price
        type: number

      - name: offer_id
        sql: offer_id
        type: string

      # dimension_group: order_charged (timeframes: raw, time, date, week, month, quarter, year)
      # -> all native Cube granularities, so a single time dimension covers them.
      - name: order_charged
        sql: order_charged_date
        type: time

      - name: order_charged_timestamp
        sql: order_charged_timestamp
        type: number

      - name: order_number
        sql: order_number
        type: string

      - name: postal_code_of_buyer
        sql: postal_code_of_buyer
        type: string

      - name: product_id
        sql: product_id
        type: string

      - name: product_title
        sql: product_title
        type: string

      - name: product_type
        sql: product_type
        type: string

      - name: promotion_id
        sql: promotion_id
        type: string

      - name: sku_id
        sql: sku_id
        type: string

      - name: state_of_buyer
        sql: state_of_buyer
        type: string

      - name: taxes_collected
        sql: taxes_collected
        type: number

    measures:
      - name: count
        type: count

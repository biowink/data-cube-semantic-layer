# Shared refresh interval for every cube in this file, in place of the
# LookML datagroup_trigger (nightly_datagroup). Change it here only.
# Cron: Thursdays at 03:00 (UTC, Cube's default when no timezone is set).
{% set suggestions_refresh_every = "0 3 * * 4" %}

cubes:
  - name: suggested_event_properties
    sql: >
      WITH keys_data AS (
        SELECT map_keys(CAST(json_parse(event_properties) AS map(varchar, json))) AS keys
        FROM der.events
        WHERE events.derived_tstamp >= CURRENT_DATE - INTERVAL '3' DAY
      )
      SELECT DISTINCT key
      FROM keys_data
      CROSS JOIN UNNEST (keys) AS t (key)
    description: "Migrated from the suggested_event_properties LookML view"
    public: false
    refresh_key:
      every: "{{ suggestions_refresh_every }}"

    # Stored in Cube Store and rebuilt by the refresh worker on the same schedule,
    # like the LookML PDT, so queries read the stored rows instead of der.events.
    pre_aggregations:
      - name: suggested_event_values
        dimensions:
          - event_property_name
        refresh_key:
          every: "{{ suggestions_refresh_every }}"

    dimensions:
      # The LookML declares mobile_event_name {} and event_property_name {} with no
      # sql, which default to columns the derived table doesn't output (it only
      # returns key). mobile_event_name is dropped; event_property_name maps to key.
      # Not a primary key in the LookML; key is DISTINCT above, so it is one here.
      - name: event_property_name
        sql: "{CUBE}.key"
        type: string
        primary_key: true
        public: true

  - name: suggested_mobile_event_names
    sql: >
      SELECT mobile_event_name
      FROM der.events
      WHERE derived_tstamp >= CURRENT_DATE - INTERVAL '3' DAY
      GROUP BY 1
    description: "Migrated from the suggested_mobile_event_names LookML view"
    public: false
    refresh_key:
      every: "{{ suggestions_refresh_every }}"

    # Stored in Cube Store and rebuilt by the refresh worker on the same schedule,
    # like the LookML PDT, so queries read the stored rows instead of der.events.
    pre_aggregations:
      - name: suggested_event_values
        dimensions:
          - mobile_event_name
        refresh_key:
          every: "{{ suggestions_refresh_every }}"

    dimensions:
      # One row per mobile_event_name (GROUP BY above), so it is the primary key.
      # Primary keys are hidden by default; keep it visible as in the LookML.
      - name: mobile_event_name
        sql: "{CUBE}.mobile_event_name"
        type: string
        primary_key: true
        public: true


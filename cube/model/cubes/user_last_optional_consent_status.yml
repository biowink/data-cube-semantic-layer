cubes:
  - name: user_last_optional_consent_status
    sql_table: user_metrics.user_last_optional_consent_status
    description: "Migrated from user_last_optional_consent_status.view.lkml. Looker view label: \"User Last Optional Consent Status\""
    public: false

    dimensions:
      # no primary key declared in the source LookML view; analytics_id is one
      # row per user in this table
      - name: analytics_id
        sql: analytics_id
        type: string
        primary_key: true
        public: false

      - name: consent_health_analytics
        sql: consent_health_analytics
        type: boolean
        meta:
          group_label: "Optional Consent Type"

      - name: consent_health_analytics_revoke_at
        sql: consent_health_analytics_revoke_ts
        type: time
        public: false

      - name: consent_product_promotion
        sql: consent_product_promotion
        type: boolean
        meta:
          group_label: "Optional Consent Type"

      - name: consent_product_promotion_revoke_at
        sql: consent_product_promotion_revoke_ts
        type: time
        public: false

      - name: consent_scientific_research
        sql: consent_scientific_research
        type: boolean
        meta:
          group_label: "Optional Consent Type"

      - name: consent_scientific_research_revoke_at
        sql: consent_scientific_research_revoke_ts
        type: time
        public: false

      - name: consent_usage_analytics
        sql: consent_usage_analytics
        type: boolean
        meta:
          group_label: "Optional Consent Type"

      - name: consent_usage_analytics_revoke_at
        sql: consent_usage_analytics_revoke_ts
        type: time
        public: false

      - name: consent_usage_marketing
        sql: consent_usage_marketing
        type: boolean
        meta:
          group_label: "Optional Consent Type"

      - name: consent_usage_marketing_revoke_at
        sql: consent_usage_marketing_revoke_ts
        type: time
        public: false

      - name: created_by_task
        sql: created_by_task
        type: string
        public: false

      - name: created_execution_at
        sql: created_execution_date
        type: time
        public: false

      - name: etl_created_at
        sql: etl_created_at
        type: time
        public: false

      - name: etl_updated_at
        sql: etl_updated_at
        type: time
        public: false

      - name: optional_consent_version
        sql: optional_consent_version
        type: number

      - name: product_analytics_usage
        sql: "{CUBE}.consent_usage_analytics AND {CUBE}.consent_health_analytics"
        type: boolean
        description: "Applies Usage- and Health Analytics-type consents"
        meta:
          group_label: "Usage Purpose"

      - name: scientific_research_usage
        sql: "{CUBE}.consent_usage_analytics AND {CUBE}.consent_health_analytics AND {CUBE}.consent_scientific_research"
        type: boolean
        description: "Applies Usage-, Health-, and Research Analytics-type consents"
        meta:
          group_label: "Usage Purpose"

      - name: product_promotion_usage
        sql: "{CUBE}.consent_usage_analytics AND {CUBE}.consent_product_promotion"
        type: boolean
        description: "Applies Usage- and Product Promotion-type consents"
        meta:
          group_label: "Usage Purpose"
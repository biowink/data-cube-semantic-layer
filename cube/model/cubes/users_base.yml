cubes:
  - name: users_base
    sql_table: core.clue_users
    description: "Migrated from views/users/users.view.lkml"
    public: false

    #todo: From the LookML users explore. Joins to views not yet migrated to cubes
    # (user_account_source, user_device_connections, dynamic_user_fields)
    # are left out for now.
    # market_mapping and apple_device_mapping join via user_last_properties.
    joins:
      - name: user_last_properties
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {user_last_properties.analytics_id}"

      - name: user_profiles
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {user_profiles.analytics_id}"

      - name: user_last_optional_consent_status
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {user_last_optional_consent_status.analytics_id}"

      - name: new_user_activation
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {new_user_activation.analytics_id}"

      - name: new_user_retention
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {new_user_retention.analytics_id}"

      - name: adjust_attribution
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {adjust_attribution.analytics_id}"

      - name: user_goal_attributes
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {user_goal_attributes.analytics_id}"

      # The LookML sql_on also requires user_last_properties /
      # user_last_optional_consent_status to have a row for the same analytics_id
      # (the users condition is implied, users is this cube). Cube join SQL can't
      # reference other cubes, so those checks are EXISTS on their tables.
      - name: braze_global_control_group
        relationship: one_to_one
        sql: >
          {CUBE}.analytics_id = {braze_global_control_group.analytics_id}
          AND EXISTS (SELECT 1 FROM user_metrics.user_last_session_attributes p WHERE p.analytics_id = {CUBE}.analytics_id)
          AND EXISTS (SELECT 1 FROM user_metrics.user_last_optional_consent_status c WHERE c.analytics_id = {CUBE}.analytics_id)

      - name: user_first_properties
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {user_first_properties.analytics_id}"

      - name: user_subscription_status
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {user_subscription_status.analytics_id}"

      - name: user_last_device_properties
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {user_last_device_properties.analytics_id}"

    dimensions:
      - name: analytics_id
        sql: analytics_id
        type: string
        primary_key: true

      # dimension_group: account_created -> base time dim + the timeframes Cube
      # can't derive at query time (day_of_week/day_of_month/day_of_year/week_of_year/month_num)
      - name: account_created_at
        sql: "{CUBE}.backend_created_at"
        type: time

      - name: account_created_day_of_week
        sql: "date_format({CUBE}.backend_created_at, '%W')"
        type: string

      - name: account_created_day_of_month
        sql: "day_of_month({CUBE}.backend_created_at)"
        type: number

      - name: account_created_day_of_year
        sql: "day_of_year({CUBE}.backend_created_at)"
        type: number

      - name: account_created_week_of_year
        sql: "week({CUBE}.backend_created_at)"
        type: number

      - name: account_created_month_num
        sql: "month({CUBE}.backend_created_at)"
        type: number

      # helper: day-truncated version - needed by subscriptions_events' duration
      # dimensions (days_since_account_created, etc), not from the original LookML
      - name: account_created_date
        sql: "DATE_TRUNC('day', {CUBE}.backend_created_at)"
        type: time

      # parameter: date_granularity_selector / dynamic_date_granularity dropped:
      # Cube lets a client request account_created_at at any granularity
      # (day/week/month/quarter) per-query natively, so no schema field is needed.

      - name: account_is_verified
        sql: "{CUBE}.email_is_verified"
        type: boolean

      - name: is_test_user
        sql: "{CUBE}.is_internal_user"
        type: boolean

    measures:
      - name: user_count
        sql: "{CUBE}.analytics_id"
        type: count_distinct

      # New users so far this month, complete days only
      - name: new_users_mtd
        type: count
        filters:
          - sql: >
              {CUBE}.backend_created_at >= date_trunc('month', current_date) AND {CUBE}.backend_created_at < current_date

      # Linear projection to the end of the month
      - name: projected_new_users
        type: number
        sql: >
          {new_users_mtd} * 1.0
          * day(last_day_of_month(current_date))
          / NULLIF(day(current_date) - 1, 0)
        format: number

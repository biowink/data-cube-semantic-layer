cubes:
  - name: adjust_attribution
    sql_table: user_metrics.adjust_attribution
    description: "Migrated from adjust_attirbution_view.lkml"

    joins:
      # needed for the network_group / network_group_without_owned dimensions below,
      # which reference user_last_properties.platform
      - name: user_last_properties
        relationship: one_to_one
        sql: "{CUBE}.analytics_id = {user_last_properties.analytics_id}"

    dimensions:
      - name: analytics_id
        sql: analytics_id
        type: string
        primary_key: true
        public: false

      # dimension_group: click (timeframes: raw/time/date/week/month/quarter/year all
      # derivable at query time via Cube granularity) + day_of_year/month_num, which aren't
      - name: click_at
        sql: click_time
        type: time

      - name: click_day_of_year
        sql: "day_of_year({CUBE}.click_time)"
        type: number

      - name: click_month_num
        sql: "month({CUBE}.click_time)"
        type: number

      # dimension_group: install
      - name: install_at
        sql: install_time
        type: time

      - name: install_day_of_year
        sql: "day_of_year({CUBE}.install_time)"
        type: number

      - name: install_month_num
        sql: "month({CUBE}.install_time)"
        type: number

      # dimension_group: reattribution
      - name: reattribution_at
        sql: reattribution_time
        type: time

      - name: reattribution_day_of_year
        sql: "day_of_year({CUBE}.reattribution_time)"
        type: number

      - name: reattribution_month_num
        sql: "month({CUBE}.reattribution_time)"
        type: number

      - name: network
        sql: "CASE WHEN {CUBE}.network = 'Facebook' THEN 'Meta' ELSE {CUBE}.network END"
        type: string
        meta:
          group_label: Attribution

      - name: network_group
        sql: >
          CASE WHEN {CUBE}.network IN ('Organic', 'Google Organic Search', 'test tracker') AND {user_last_properties.platform} IS NOT NULL
                 THEN 'Organic - ' || {user_last_properties.platform}
               WHEN {CUBE}.network IN ('Screen Shot', 'Share Clue')
                 THEN 'Link Sharing'
               WHEN {CUBE}.network IN ('Content', 'Clue account - Website', 'Homepage', 'Clue Website')
                 THEN 'helloclue.com'
               WHEN {CUBE}.network IN ('TikTok', 'Google Ads ACI', 'Facebook')
                 THEN COALESCE(NULLIF({CUBE}.network, 'Facebook'), 'Meta') || ' - ' || {user_last_properties.platform}
               WHEN {CUBE}.network IN ('Apple Search Ads', 'Clue Connect')
                 THEN {CUBE}.network
               WHEN {CUBE}.network = 'Facebook'
                 THEN 'Meta'
               WHEN {CUBE}.network = 'TikTok Brand' THEN 'Brand Campaigns'
               WHEN {CUBE}.network IS NULL
                 THEN 'No Attribution'
               ELSE 'Other'
          END
        type: string
        meta:
          group_label: Attribution

      - name: network_group_without_owned
        sql: >
          CASE WHEN {user_last_properties.platform} NOT IN ('ios', 'android')
                 THEN 'Other'
               WHEN {CUBE}.network IN ('Organic', 'Google Organic Search')
                 THEN 'Organic - ' || {user_last_properties.platform}
               WHEN {CUBE}.network IN ('Screen Shot', 'Share Clue', 'Content', 'Clue account - Website', 'Homepage', 'Clue Website', 'Clue Connect')
                 THEN 'Owned'
               WHEN {CUBE}.network IN ('TikTok', 'Google Ads ACI', 'Facebook')
                 THEN COALESCE(NULLIF({CUBE}.network, 'Facebook'), 'Meta') || ' - ' || {user_last_properties.platform}
               WHEN {CUBE}.network = 'Apple Search Ads'
                 THEN {CUBE}.network
               WHEN {CUBE}.network = 'TikTok Brand' THEN 'Brand Campaigns'
               WHEN {CUBE}.network IS NULL
                 THEN 'No Attribution'
               ELSE 'Other'
          END
        type: string
        meta:
          group_label: Attribution

      - name: campaign
        sql: campaign
        type: string
        meta:
          group_label: Attribution

      - name: adgroup
        sql: adgroup
        type: string
        meta:
          group_label: Attribution

      - name: creative
        sql: creative
        type: string
        meta:
          group_label: Attribution

      - name: first_network
        sql: "CASE WHEN {CUBE}.first_network = 'Facebook' THEN 'Meta' ELSE {CUBE}.first_network END"
        type: string
        meta:
          group_label: "First Attribution"

      - name: first_campaign
        sql: first_campaign
        type: string
        meta:
          group_label: "First Attribution"

      - name: first_adgroup
        sql: first_adgroup
        type: string
        meta:
          group_label: "First Attribution"

      - name: first_creative
        sql: first_creative
        type: string
        meta:
          group_label: "First Attribution"

      - name: source_type
        sql: >
          CASE
            WHEN {CUBE}.network IS NULL THEN 'no attribution'
            WHEN {CUBE}.network IN ('Organic', 'Google Organic Search', 'test tracker') THEN 'organic'
            WHEN {CUBE}.network IN ('Google Ads ACI', 'Apple Search Ads', 'TikTok', 'Facebook') THEN 'paid'
            WHEN {CUBE}.network = 'TikTok Brand' THEN 'brand'
            ELSE 'owned'
          END
        type: string
        meta:
          group_label: Attribution

      - name: first_source_type
        sql: >
          CASE
            WHEN {CUBE}.first_network IS NULL THEN 'no attribution'
            WHEN {CUBE}.first_network IN ('Organic', 'Google Organic Search', 'test tracker') THEN 'organic'
            WHEN {CUBE}.first_network IN ('Google Ads ACI', 'Apple Search Ads', 'TikTok', 'Facebook', 'Reddit', 'Applovin', 'Snapchat', 'Taboola', 'Influencers', 'TvScientific') THEN 'paid'
            WHEN {CUBE}.network = 'TikTok Brand' THEN 'brand'
            ELSE 'owned'
          END
        type: string
        meta:
          group_label: "First Attribution"

      - name: optimisation_goal
        sql: >
          CASE WHEN ({CUBE}.campaign LIKE '%_Reg%'
                     OR {CUBE}.campaign LIKE '%_REG%'
                     OR {CUBE}.campaign LIKE '%_reg%'
                     OR {CUBE}.campaign LIKE '%_Generic%'
                     OR {CUBE}.campaign LIKE '%_Brand%'
                     OR {CUBE}.campaign LIKE '%_Competitor%'
                     OR {CUBE}.campaign LIKE '%_Probing%'
                     OR {CUBE}.campaign LIKE 'UK_ASA_PeriodTracker_January2026%')
                     AND {CUBE}.campaign NOT LIKE '%_Install%'
               THEN 'Registration'
               WHEN ({CUBE}.campaign LIKE '%install%'
                     OR {CUBE}.campaign LIKE '%Install%'
                     OR {CUBE}.campaign LIKE '%_Discovery%'
                     OR {CUBE}.campaign = 'unknown (1809913192032305)')
                     AND {CUBE}.campaign NOT LIKE '%_Reg%'
               THEN 'Install'
               WHEN {CUBE}.campaign LIKE '%_FreeTrial%'
               THEN 'Free Trial'
               WHEN ({CUBE}.campaign LIKE '%_tROAS%'
                     OR {CUBE}.campaign LIKE '%_TROAS%')
               THEN 'tROAS'
               WHEN {CUBE}.campaign LIKE '%Subscription%'
               THEN 'Subscription'
               WHEN {CUBE}.campaign LIKE '%_SearchTab%'
               THEN 'Search Tab'
               ELSE 'none'
          END
        type: string
################################################################## Cost-Per Metrics
      - name: CPM
        description: Cost per 1000 Impressions
        title: "CPM"
        sql: |-
          {ad_spend} / NULLIF({impressions},0) * 1000
        type: number
        format: currency
        currency: EUR

      - name: CPC
        description: Cost per Click
        title: "CPC"
        sql: |-
          {ad_spend} / NULLIF({clicks},0)
        type: number
        format: currency
        currency: EUR

      - name: CPI
        description: Using Adjust installs
        title: "CPI"
        sql: |-
          {ad_spend} / NULLIF({adjust_installs},0)
        type: number
        format: currency
        currency: EUR

      - name: CPR
        description: Cost per Registration
        title: "CPR"
        sql: |-
          {ad_spend} / NULLIF({d0_created_account_conversions},0)
        type: number
        format: currency
        currency: EUR

      - name: CPFT
        description: Cost per Free Trial
        title: "CPFT"
        sql: |-
          {ad_spend} / NULLIF({d0_free_trial_conversions},0)
        type: number
        format: currency
        currency: EUR

      - name: CPD0C
        description: Cost per D0 Conversion
        title: "CPD0C"
        sql: |-
          {ad_spend} / NULLIF({total_d0_subscription_conversions},0)
        type: number
        format: currency
        currency: EUR

      - name: CPD7PC
        description: Cost per D7 Paid Conversion
        title: "CPD7PC"
        sql: |-
          {ad_spend_d7} / NULLIF({total_d7_paid_conversions},0)
        type: number
        format: currency
        currency: EUR

################################################################## LTV:CAC
      - name: predicted_d360_conversions
        title: D360 Predicted Conversions
        sql: |-
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.predicted_backend_d360_conversions
          ELSE {CUBE}.predicted_d360_conversions
          END
        type: sum

      - name: predicted_d360_total_ltv
        title: D360 Predicted Total LTV
        sql: |-
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.predicted_backend_d360_total_ltv
          ELSE {CUBE}.predicted_d360_total_ltv
          END
        type: sum
        format: currency
        currency: EUR

      - name: paid_predicted_d360_total_ltv
        title: Paid D360 Pred. Total LTV
        sql: |-
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.predicted_backend_d360_total_ltv
          ELSE {CUBE}.predicted_d360_total_ltv
          END
        type: sum
        format: currency
        currency: EUR
        public: false
        filters:
          - sql: "{source_type} = 'paid'"

      - name: d360_d7_ccm
        title: D360/D7 CCM
        sql: |-
          {predicted_d360_conversions} / NULLIF({total_d7_paid_conversions},0)
        type: number

      - name: d360_d0_ccm
        title: D360/D0 CCM
        sql: |-
          {predicted_d360_conversions} / NULLIF({total_d0_subscription_conversions},0)
        type: number

      - name: predicted_d360_cac
        title: D360 Predicted CAC
        sql: |-
          {ad_spend_d7} / NULLIF({predicted_d360_conversions},0)
        type: number
        format: currency
        currency: EUR

      - name: predicted_d360_ltv
        title: LTV
        description: Average 3-Year LTV of D360 predicted converted users
        sql: |-
          {predicted_d360_total_ltv} / NULLIF({predicted_d360_conversions},0)
        type: number
        format: currency
        currency: EUR

      - name: predicted_d360_ltv_to_cac_ratio
        title: "LTV:CAC Ratio"
        sql: |-
          {predicted_d360_total_ltv} / NULLIF({ad_spend_d7},0)
        type: number

      - name: predicted_d360_paid_ltv_to_cac_ratio
        title: "Paid LTV:CAC Ratio"
        sql: |-
          {paid_predicted_d360_total_ltv} / NULLIF({ad_spend_d7},0)
        type: number

################################################################## Rate Metrics
      - name: click_through_rate
        description: Total clicks / total impressions
        sql: |-
          CAST({clicks} AS DOUBLE) / NULLIF({impressions},0)
        type: number
        format: percent

      - name: cvr_to_install
        title: CVR to Install
        description: Total installs / total clicks
        sql: |-
          CAST({adjust_installs} AS DOUBLE) / NULLIF({clicks},0)
        type: number
        format: percent

      - name: adjust_d0_conversion_rate_to_registration
        title: D0 CVR to Registration
        description: Conversion Rate from Install to Registration on D0
        sql: |-
          CAST({d0_created_account_conversions} AS DOUBLE) / NULLIF({adjust_installs},0)
        type: number
        format: percent

      - name: adjust_d0_conversion_rate
        title: D0 CVR - Adjust Attribution
        description: Conversion Rate from Install to Free Trial/1m Subscription purchase on D0
        sql: |-
          CAST({total_d0_subscription_conversions} AS DOUBLE) / NULLIF({adjust_installs},0)
        type: number
        format: percent

      - name: adjust_d7_conversion_rate
        title: D7 CVR - Adjust Attribution
        description: Conversion Rate from Install to Paid Subscription purchase on D7
        sql: |-
          CAST({total_d7_paid_conversions} AS DOUBLE) / NULLIF({adjust_installs},0)
        type: number
        format: percent

      - name: skad_d0_conversion_rate
        title: D0 CVR - SKAdNetwork Attribution
        description: Conversion Rate from Install to Free Trial/1m Subscription purchase on D0
        sql: |-
          CAST({total_skad_d0_conversions} AS DOUBLE) / NULLIF({skad_installs},0)
        type: number
        format: percent

# ---------------------------------------------------------------------------
# Dynamic Fields — needs a manual decision, not auto-converted
# ---------------------------------------------------------------------------
# The Looker view used four `parameter` blocks to let a dashboard viewer pick a granularity,
# a breakdown dimension, or a metric from a dropdown, and had dimensions/measures whose SQL
# branched on that pick via Liquid (). Cube's plain YAML schema has no equivalent
# of a Looker parameter — there's no built-in "pick a field at query time" control.
#
# The good news: every option those pickers could switch to is already a normal, separate
# dimension or measure in this file (network, campaign, market_3, country, adgroup, creative,
# platform, source_type, optimisation_goal, region for dimension_selector; installs, clicks,
# impressions, the D0/D7 conversion + rate measures, ad_spend, CPC, CPI, CPM, CPR, CPD0C, CPFT,
# predicted_d360_cac, predicted_d360_ltv_to_cac_ratio, d7_roas, d30_roas for metric_selector).
# So no analysis is lost — the difference is just that in Metabase, someone picks the field
# directly (as a column / summarize-by choice) instead of via a Looker-style dropdown parameter.
#
# Field-by-field:
#   - granularity_selector + dynamic_date  -> not needed: the `date` time dimension above
#     already supports day/week/month/quarter granularity natively in any Cube-aware BI tool.
#   - dimension_selector + dynamic_user_dimension -> use the underlying dimension directly
#     (network, campaign, market_3, country, adgroup, creative, platform, source_type,
#     optimisation_goal, or region).
#   - metric_selector + dynamic_rate_metric / dynamic_spend_metric -> use the underlying
#     measure directly (see list above).
#   - paid_user_estimate + paid_user_input -> this was a free-text numeric input Looker
#     injected into a query at run time. Cube has no query-time user input in the YAML schema;
#     if this is still needed, it would have to become a Metabase question-level parameter/filter
#     (native SQL question) rather than a cube member — flagging for you to confirm it is still used.
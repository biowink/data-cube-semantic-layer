          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d14_backend_1m_subscription_revenue
          ELSE {CUBE}.d14_1m_subscription_revenue
          END
          END
        type: sum
        format: currency
        currency: EUR

      - name: d14_12m_subscription_conversions
        description: Number of users who installed on the given date who then converted to the 12m subscription within 14 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '15' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d14_backend_12m_subscription_conversions
          ELSE {CUBE}.d14_12m_subscription_conversions
          END
          END
        type: sum

      - name: d14_12m_subscription_revenue
        description: Total revenue from users who installed on the given date who then converted to the 12m subscription within 14 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '15' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d14_backend_12m_subscription_revenue
          ELSE {CUBE}.d14_12m_subscription_revenue
          END
          END
        type: sum
        format: currency
        currency: EUR

      - name: d14_partner_subscription_conversions
        description: Number of users who installed on the given date who then converted to a partner subscription within 14 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '15' DAY THEN NULL
          ELSE {CUBE}.d14_backend_partner_subscription_conversions
          END
        type: sum

      - name: d14_partner_subscription_revenue
        description: Total revenue from users who installed on the given date who then converted to a partner subscription within 14 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '15' DAY THEN NULL
          ELSE {CUBE}.d14_backend_partner_subscription_revenue
          END
        type: sum
        format: currency
        currency: EUR

      - name: total_d14_paid_conversions
        description: "D14 1m Subscriptions + D14 12m Subscriptions + D14 Partner Subscriptions"
        sql: |-
          COALESCE({d14_1m_subscription_conversions},0) + COALESCE({d14_12m_subscription_conversions},0) + + COALESCE({d14_partner_subscription_conversions},0)
        type: number

      - name: total_d14_revenue
        description: "D14 1m Subscription Revenue + D14 12m Subscription Revenue + D14 Partner Subscription Revenue"
        sql: |-
          COALESCE({d14_12m_subscription_revenue},0) + COALESCE({d14_1m_subscription_revenue},0)  + COALESCE({d14_partner_subscription_revenue},0)
        type: number
        format: currency
        currency: EUR

      - name: paid_d14_revenue
        title: Paid D14 Revenue
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '15' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN COALESCE({CUBE}.d14_backend_12m_subscription_revenue,0) + COALESCE({CUBE}.d14_backend_1m_subscription_revenue,0) + COALESCE({CUBE}.d14_backend_partner_subscription_conversions, 0)
          ELSE COALESCE({CUBE}.d14_12m_subscription_revenue,0) + COALESCE({CUBE}.d14_1m_subscription_revenue,0) + COALESCE({CUBE}.d14_backend_partner_subscription_conversions, 0)
          END
          END
        type: sum
        format: currency
        currency: EUR
        public: false
        filters:
          - sql: "{source_type} = 'paid'"

      - name: d14_roas
        title: D14 ROAS
        description: Revenue at D14 over ad spend
        sql: |-
          NULLIF({total_d14_revenue},0) / {ad_spend_d14}
        type: number

      - name: paid_d14_roas
        title: Paid D14 ROAS
        description: Paid Revenue at D14 over ad spend
        sql: |-
          NULLIF({paid_d14_revenue},0) / {ad_spend_d14}
        type: number


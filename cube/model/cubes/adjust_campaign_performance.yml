# Cube data model — migrated from the Looker view `adjust_campaign_performance`.
# Source: der.adjust_campaign_performance
#
# Converted mechanically field-by-field: ${TABLE} -> {CUBE}, ${other_field} -> {other_field},
# label -> title, group_label -> meta.looker_group_label, value_format_name -> meta.looker_value_format
# (+ format: percent where applicable), hidden: yes -> public: false, filters: [...] -> filters: [{sql: ...}].
#
# NOT included below — these relied on Looker parameters (dynamic pickers), which have no direct
# equivalent in a plain Cube YAML schema. See the "Dynamic Fields" note at the end of this file.
#   - parameters: granularity_selector, dimension_selector, metric_selector, paid_user_estimate
#   - fields driven by them: dynamic_date, dynamic_user_dimension, dynamic_rate_metric,
#     dynamic_spend_metric, paid_user_input
#
cubes:
  - name: adjust_campaign_performance
    sql_table: der.adjust_campaign_performance

    # NOTE: no natural primary key was declared on the Looker view. Cube works without
    # one for simple aggregations, but a primary_key dimension is needed for joins and for
    # some pre-aggregation features. Confirm the true grain of der.adjust_campaign_performance (looks like
    # date + network + campaign + adgroup + creative + platform) and either expose an existing
    # surrogate key column, or add one, e.g.:
    # - name: id
    #   sql: "{CUBE}.date || '|' || {CUBE}.network || '|' || {CUBE}.campaign || '|' || {CUBE}.adgroup || '|' || {CUBE}.creative || '|' || {CUBE}.platform"
    #   type: string
    #   primary_key: true

    dimensions:
    # Dates
      - name: date
        sql: |-
          {CUBE}.date
        type: time

      - name: month_name
        title: Month Name
        sql: |-
          DATE_FORMAT({CUBE}.date, '%M')
        type: string

      - name: day_of_week
        title: Day of Week
        sql: |-
          DATE_FORMAT({CUBE}.date, '%W')
        type: string

      - name: day_of_month
        title: Day of Month
        sql: |-
          DAY({CUBE}.date)
        type: number

      - name: day_of_year
        title: Day of Year
        sql: |-
          DAY_OF_YEAR({CUBE}.date)
        type: number

    # Ad Dimensions
      - name: network
        sql: |-
          {CUBE}.network
        type: string

      - name: raw_network
        title: Network value sent from Adjust
        sql: |-
          {CUBE}.raw_network
        type: string

      - name: source_type
        sql: |-
          CASE
          WHEN {CUBE}.network IN ('Organic', 'Google Organic Search', 'test tracker') THEN 'organic'
          WHEN {CUBE}.network IN ('Google Ads ACI', 'Apple Search Ads', 'TikTok', 'Meta', 'Reddit') THEN 'paid'
          WHEN {CUBE}.network IN ('TikTok Brand', 'Meta Brand') THEN 'brand'
          ELSE 'owned'
          END
        type: string

      - name: network_group
        sql: |-
          CASE WHEN {CUBE}.platform NOT IN ('ios', 'android')
          THEN 'Other'
          WHEN {CUBE}.network IN ('Organic', 'Google Organic Search')
          THEN 'Organic - ' || {CUBE}.platform
          WHEN {CUBE}.network IN ('Screen Shot', 'Share Clue')
          THEN 'Link Sharing'
          WHEN {CUBE}.network IN ('Content', 'Clue account - Website', 'Homepage', 'Clue Website')
          THEN 'helloclue.com'
          WHEN {CUBE}.network IN ('TikTok', 'Google Ads ACI', 'Meta', 'Reddit')
          THEN {CUBE}.network || ' - ' || {CUBE}.platform
          WHEN {CUBE}.network IN ('Apple Search Ads', 'Clue Connect')
          THEN {CUBE}.network
          WHEN {CUBE}.network IN ('TikTok Brand', 'Meta Brand') THEN 'Brand Campaigns'
          WHEN {CUBE}.network IS NULL
          THEN 'No Attribution'
          ELSE 'Other'
          END
        type: string

      - name: network_group_without_owned
        sql: |-
          CASE WHEN {CUBE}.platform NOT IN ('ios', 'android')
          THEN 'Other'
          WHEN {CUBE}.network IN ('Organic', 'Google Organic Search')
          THEN 'Organic - ' || {CUBE}.platform
          WHEN {CUBE}.network IN ('Screen Shot', 'Share Clue', 'Content', 'Clue account - Website', 'Homepage', 'Clue Website', 'Clue Connect')
          THEN 'Owned'
          WHEN {CUBE}.network IN ('TikTok', 'Google Ads ACI', 'Meta', 'Reddit')
          THEN {CUBE}.network || ' - ' || {CUBE}.platform
          WHEN {CUBE}.network = 'Apple Search Ads'
          THEN {CUBE}.network
          WHEN {CUBE}.network IN ('TikTok Brand', 'Meta Brand') THEN 'Brand Campaigns'
          WHEN {CUBE}.network IS NULL
          THEN 'No Attribution'
          ELSE 'Other'
          END
        type: string

      - name: campaign
        sql: |-
          {CUBE}.campaign
        type: string

      - name: adgroup
        sql: |-
          {CUBE}.adgroup
        type: string

      - name: content_category
        sql: |-
          CASE WHEN {CUBE}.adgroup like 'Article Slug%'
          THEN ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.adgroup, '/'), 1), ': '), -1)
          ELSE NULL END
        type: string

      - name: creative
        sql: |-
          {CUBE}.creative
        type: string

      - name: campaign_without_id
        title: Campaign without ID
        sql: |-
          {CUBE}.campaign_name
        type: string

      - name: adgroup_without_id
        title: Adgroup without ID
        sql: |-
          {CUBE}.adgroup_name
        type: string

      - name: creative_without_id
        title: Creative without ID
        sql: |-
          {CUBE}.creative_name
        type: string

      - name: creative_without_group
        title: Creative without Group
        sql: |-
          array_join(slice(split({CUBE}.creative_name, '_'), 1, 9), '_')
        type: string

      - name: creative_language
        sql: |-
          ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.creative, ' '), 1), '_'),1)
        type: string

      - name: creative_app_mode
        sql: |-
          ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.creative, ' '), 1), '_'),2)
        type: string

      - name: creative_style
        sql: |-
          ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.creative, ' '), 1), '_'),3)
        type: string

      - name: creative_topic
        sql: |-
          ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.creative, ' '), 1), '_'),4)
        type: string

      - name: creative_details
        sql: |-
          ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.creative, ' '), 1), '_'),5)
        type: string

      - name: creative_dimensions
        sql: |-
          ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.creative, ' '), 1), '_'),6),'.'), 1)
        type: string

      - name: creative_creator
        sql: |-
          ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.creative, ' '), 1), '_'),7),'.'), 1)
        type: string

      - name: creative_batch
        sql: |-
          ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.creative, ' '), 1), '_'),8),'.'), 1)
        type: string

      - name: country
        sql: |-
          {CUBE}.country
        type: string

      - name: country_code
        sql: |-
          {CUBE}.country_code
        type: string

      - name: market
        title: Market (4)
        sql: |-
          COALESCE({CUBE}.market, 'Rest of World')
        type: string

      - name: market_3
        title: Market (3)
        sql: |-
          CASE WHEN {market} IN ('Strategic w/o US and Europe', 'Strategic Europe') THEN 'Non-US Strategic' ELSE {market} END
        type: string

      - name: region
        sql: |-
          {CUBE}.region
        type: string

      - name: platform
        sql: |-
          {CUBE}.platform
        type: string

      - name: optimisation_goal
        sql: |-
          CASE WHEN {CUBE}.campaign like '%_NewLanguage%'
          THEN 'New Language'
          WHEN ({CUBE}.campaign like '%_Reg%'
          OR {CUBE}.campaign like '%_REG%'
          OR {CUBE}.campaign like '%_reg%'
          OR {CUBE}.campaign like '%_Generic%'
          OR {CUBE}.campaign like '%_Competitor%'
          OR {CUBE}.campaign like '%_Probing%'
          OR {CUBE}.campaign like 'UK_ASA_PeriodTracker_January2026%')
          AND {CUBE}.campaign not like '%_Install%'
          THEN 'Registration'
          WHEN {CUBE}.campaign like '%_Brand%'
          THEN 'Brand'
          WHEN ({CUBE}.campaign like '%install%'
          OR {CUBE}.campaign like '%Install%'
          OR {CUBE}.campaign like '%_Discovery%'
          OR {CUBE}.campaign = 'unknown (1809913192032305)')
          AND {CUBE}.campaign not like '%_Reg%'
          THEN 'Install'
          WHEN {CUBE}.campaign like '%_FreeTrial%'
          THEN 'Free Trial'
          WHEN ({CUBE}.campaign like '%_tROAS%'
          OR {CUBE}.campaign like '%_TROAS%')
          THEN 'tROAS'
          WHEN {CUBE}.campaign like '%Subscription%'
          THEN 'Subscription'
          WHEN {CUBE}.campaign like '%_SearchTab%'
          THEN 'Search Tab'
          ELSE 'none' END
        type: string

      - name: campaign_goal
        sql: |-
          CASE WHEN ({CUBE}.campaign like '%tROAS%'
          OR {CUBE}.campaign like '%FreeTrial%'
          OR {CUBE}.campaign like '%Brand%')
          THEN 'LTV:CAC'
          WHEN ({CUBE}.campaign like '%Registration%'
          OR {CUBE}.campaign like '%Install%'
          OR {CUBE}.campaign like '%Discovery%'
          OR {CUBE}.campaign like '%Probing%'
          OR {CUBE}.campaign like '%Generic%'
          OR {CUBE}.campaign like '%Competitors%'
          OR {CUBE}.campaign like '%Perimenopause%'
          OR {CUBE}.campaign like '%Reg%'
          OR {CUBE}.campaign like '%reg%'
          OR {CUBE}.campaign like '%Competitor%')
          THEN 'MAU'
          ELSE NULL END
        type: string

    measures:
      - name: clicks
        sql: |-
          {CUBE}.clicks
        type: sum

      - name: impressions
        sql: |-
          {CUBE}.impressions
        type: sum

      - name: adjust_installs
        title: "Installs"
        description: Installs as attributed by Adjust
        sql: |-
          {CUBE}.installs
        type: sum

      - name: skad_installs
        title: "Installs - SKAdNetwork Attribution"
        description: Installs as attributed by SKAdNetwork
        sql: |-
          {CUBE}.skad_installs
        type: sum

      - name: skad_reinstalls
        title: "Reinstalls - SKAdNetwork Attribution"
        description: Reinstalls as attributed by SKAdNetwork
        sql: |-
          {CUBE}.skad_reinstalls
        type: sum

      - name: limit_ad_tracking_installs
        description: Number of installs (Adjust-attributed) who did not consent to be tracked. This means that Adjust must use probabilistic attribution rather than direct attribution.
        sql: |-
          {CUBE}.limit_ad_tracking_installs
        type: sum

      - name: sessions
        sql: |-
          {CUBE}.sessions
        type: sum

      - name: ad_spend
        description: Ad spend as reported by each network
        sql: |-
          {CUBE}.cost
        type: sum
        format: currency
        currency: EUR

      - name: ad_spend_d7
        description: Ad spend as reported by each network
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE {CUBE}.cost
          END
        type: sum
        format: currency
        currency: EUR
        public: false

      - name: ad_spend_d14
        description: Ad spend as reported by each network
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '15' DAY THEN NULL
          ELSE {CUBE}.cost
          END
        type: sum
        format: currency
        currency: EUR
        public: false

      - name: ad_spend_d30
        description: Ad spend as reported by each network
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '31' DAY THEN NULL
          ELSE {CUBE}.cost
          END
        type: sum
        format: currency
        currency: EUR
        public: false

      - name: ad_spend_d120
        description: Ad spend as reported by each network
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '121' DAY THEN NULL
          ELSE {CUBE}.cost
          END
        type: sum
        format: currency
        currency: EUR
        public: false

      - name: ad_spend_d360
        description: Ad spend as reported by each network
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '361' DAY THEN NULL
          ELSE {CUBE}.cost
          END
        type: sum
        format: currency
        currency: EUR
        public: false

      - name: ad_spend_usd
        title: "Ad Spend USD"
        description: Ad spend from TvScientific, reported in USD
        sql: |-
          {CUBE}.cost_in_usd
        type: sum
        format: currency
        currency: USD

      - name: gdpr_forgets
        title: "GDPR Forgets"
        sql: |-
          {CUBE}.gdpr_forgets
        type: sum

      - name: age_above_44_events
        sql: |-
          {CUBE}.age_above_44_events
        type: sum

      - name: age_below_30_events
        sql: |-
          {CUBE}.age_below_30_events
        type: sum

      - name: age_between_30_and_44_events
        sql: |-
          {CUBE}.age_between_30_and_44_events
        type: sum

  ################################################################## D0 Conversions
      - name: d0_created_account_conversions
        description: Number of users who installed on the given date who then created an account within 1 day
        sql: |-
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d0_backend_created_account_conversions
          ELSE {CUBE}.d0_created_account_conversions
          END
        type: sum

      - name: d0_free_trial_conversions
        description: Number of users who installed on the given date who then converted to free trial within 1 day
        sql: |-
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d0_backend_free_trial_conversions
          ELSE {CUBE}.d0_free_trial_conversions
          END
        type: sum

      - name: d0_1m_subscription_conversions
        description: Number of users who installed on the given date who then converted to the 1m subscription within 1 day
        sql: |-
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d0_backend_1m_subscription_conversions
          ELSE {CUBE}.d0_1m_subscription_conversions
          END
        type: sum

      - name: d0_1m_subscription_revenue
        description: Total revenue from users who installed on the given date who then converted to the 1m subscription within 1 day
        sql: |-
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d0_backend_1m_subscription_revenue
          ELSE {CUBE}.d0_1m_subscription_revenue
          END
        type: sum
        format: currency
        currency: EUR

      - name: d0_12m_subscription_conversions
        description: Number of users who installed on the given date who then converted to the 12m subscription within 1 day
        sql: |-
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d0_backend_12m_subscription_conversions
          ELSE {CUBE}.d0_12m_subscription_conversions
          END
        type: sum

      - name: d0_12m_subscription_revenue
        description: Total revenue from users who installed on the given date who then converted to the 12m subscription within 1 day
        sql: |-
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d0_backend_12m_subscription_revenue
          ELSE {CUBE}.d0_12m_subscription_revenue
          END
        type: sum
        format: currency
        currency: EUR

      - name: d0_partner_subscription_conversions
        description: Number of users who installed on the given date who then converted to a partner subscription within 1 day
        sql: |-
          {CUBE}.d0_backend_partner_subscription_conversions
        type: sum

      - name: d0_partner_subscription_revenue
        description: Total revenue from users who installed on the given date who then converted to a partner subscription within 1 day
        sql: |-
          {CUBE}.d0_backend_partner_subscription_revenue
        type: sum
        format: currency
        currency: EUR

      - name: total_d0_subscription_conversions
        title: "Total D0 Conversions (Trials + Subs)"
        description: "D0 Free Trials + D0 1m Subscriptions + D0 12m Subscriptions + D0 Partner Subscriptions"
        sql: |-
          COALESCE({d0_free_trial_conversions},0) + COALESCE({d0_1m_subscription_conversions},0) + COALESCE({d0_12m_subscription_conversions},0) + COALESCE({d0_partner_subscription_conversions},0)
        type: number

      - name: total_d0_revenue
        description: "D0 1m Subscription Revenue + D0 12m Subscription Revenue + D0 Partner Revenue"
        sql: |-
          COALESCE({d0_12m_subscription_revenue},0) + COALESCE({d0_1m_subscription_revenue},0) + COALESCE({d0_partner_subscription_revenue},0)
        type: number
        format: currency
        currency: EUR

################################################################## D7 Conversions
      - name: d7_created_account_conversions
        description: Number of users who installed on the given date who then created an account within 7 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d7_backend_created_account_conversions
          ELSE {CUBE}.d7_created_account_conversions
          END
          END
        type: sum

      - name: d7_free_trial_conversions
        description: Number of users who installed on the given date who then converted to free trial within 7 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d7_backend_free_trial_conversions
          ELSE {CUBE}.d7_free_trial_conversions
          END
          END
        type: sum

      - name: d7_1m_subscription_conversions
        description: Number of users who installed on the given date who then converted to the 1m subscription within 7 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d7_backend_1m_subscription_conversions
          ELSE {CUBE}.d7_1m_subscription_conversions
          END
          END
        type: sum

      - name: d7_1m_subscription_revenue
        description: Total revenue from users who installed on the given date who then converted to the 1m subscription within 7 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d7_backend_1m_subscription_revenue
          ELSE {CUBE}.d7_1m_subscription_revenue
          END
          END
        type: sum
        format: currency
        currency: EUR

      - name: d7_12m_subscription_conversions
        description: Number of users who installed on the given date who then converted to the 12m subscription within 7 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d7_backend_12m_subscription_conversions
          ELSE {CUBE}.d7_12m_subscription_conversions
          END
          END
        type: sum

      - name: d7_12m_subscription_revenue
        description: Total revenue from users who installed on the given date who then converted to the 12m subscription within 7 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d7_backend_12m_subscription_revenue
          ELSE {CUBE}.d7_12m_subscription_revenue
          END
          END
        type: sum
        format: currency
        currency: EUR

      - name: d7_partner_subscription_conversions
        description: Number of users who installed on the given date who then converted to a partner subscription within 7 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE {CUBE}.d7_backend_partner_subscription_conversions
          END
        type: sum

      - name: d7_partner_subscription_revenue
        description: Total revenue from users who installed on the given date who then converted to a partner subscription within 7 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE {CUBE}.d7_backend_partner_subscription_revenue
          END
        type: sum
        format: currency
        currency: EUR

      - name: total_d7_paid_conversions
        description: "D7 1m Subscriptions + D7 12m Subscriptions + D0 Partner Subscriptions"
        sql: |-
          COALESCE({d7_1m_subscription_conversions},0) + COALESCE({d7_12m_subscription_conversions},0) + + COALESCE({d7_partner_subscription_conversions},0)
        type: number

      - name: total_d7_revenue
        description: "D7 1m Subscription Revenue + D7 12m Subscription Revenue + D7 Partner Subscription Revenue"
        sql: |-
          COALESCE({d7_12m_subscription_revenue},0) + COALESCE({d7_1m_subscription_revenue},0)  + COALESCE({d7_partner_subscription_revenue},0)
        type: number
        format: currency
        currency: EUR

      - name: paid_d7_revenue
        title: Paid D7 Revenue
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '8' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN COALESCE({CUBE}.d7_backend_12m_subscription_revenue,0) + COALESCE({CUBE}.d7_backend_1m_subscription_revenue,0) + COALESCE({CUBE}.d7_backend_partner_subscription_conversions, 0)
          ELSE COALESCE({CUBE}.d7_12m_subscription_revenue,0) + COALESCE({CUBE}.d7_1m_subscription_revenue,0) + COALESCE({CUBE}.d7_backend_partner_subscription_conversions, 0)
          END
          END
        type: sum
        format: currency
        currency: EUR
        public: false
        filters:
          - sql: "{source_type} = 'paid'"

      - name: d7_roas
        title: "D7 ROAS"
        description: Revenue at D7 over ad spend
        sql: |-
          NULLIF({total_d7_revenue},0) / {ad_spend_d7}
        type: number

      - name: paid_d7_roas
        title: "Paid D7 ROAS"
        description: Paid Revenue at D7 over ad spend
        sql: |-
          NULLIF({paid_d7_revenue},0) / {ad_spend_d7}
        type: number

################################################################## D14 Conversions
      - name: d14_created_account_conversions
        description: Number of users who installed on the given date who then created an account within 14 days
        sql: |-
          CASE WHEN {CUBE}.date > CURRENT_DATE - INTERVAL '15' DAY THEN NULL
          ELSE
          CASE WHEN {CUBE}.date >= DATE('2024-01-01') THEN {CUBE}.d14_backend_created_account_conversions
          ELSE {CUBE}.d14_created_account_conversions

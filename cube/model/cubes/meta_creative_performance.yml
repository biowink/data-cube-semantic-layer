cubes:
  - name: meta_creative_performance
    sql_table: der.meta_creative_performance
    description: "Migrated from views/adjust/meta_creative_performance.view.lkml"

    # The source LookML view defines no primary key, so none is set here either.
    # Add one before joining other cubes to this cube.

    dimensions:
      # dimension_group: date (date, week, month, quarter, year) - all native
      # Cube granularities. Source is a DATE column with convert_tz: no.
      - name: date
        sql: "{CUBE}.date"
        type: time

      - name: ad_id
        sql: ad_id
        type: string
        public: false

      - name: ad_name
        sql: ad_name
        type: string

      - name: adset_id
        sql: adset_id
        type: string
        public: false

      - name: adset_name
        sql: adset_name
        type: string

      - name: campaign_id
        sql: campaign_id
        type: string
        public: false

      - name: campaign_name
        sql: campaign_name
        type: string

      # Creative fields parsed from the underscore-delimited ad_name
      - name: creative_language
        sql: "ELEMENT_AT(SPLIT({CUBE}.ad_name, '_'), 1)"
        type: string

      - name: creative_app_mode
        sql: "ELEMENT_AT(SPLIT({CUBE}.ad_name, '_'), 2)"
        type: string

      - name: creative_style
        sql: "ELEMENT_AT(SPLIT({CUBE}.ad_name, '_'), 3)"
        type: string

      - name: creative_topic
        sql: "ELEMENT_AT(SPLIT({CUBE}.ad_name, '_'), 4)"
        type: string

      - name: creative_details
        sql: "ELEMENT_AT(SPLIT({CUBE}.ad_name, '_'), 5)"
        type: string

      - name: creative_dimensions
        sql: "ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.ad_name, '_'), 6), '.'), 1)"
        type: string

      - name: creative_creator
        sql: "ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.ad_name, '_'), 7), '.'), 1)"
        type: string

      - name: creative_batch
        sql: "ELEMENT_AT(SPLIT(ELEMENT_AT(SPLIT({CUBE}.ad_name, '_'), 8), '.'), 1)"
        type: string

      - name: objective
        sql: objective
        type: string

      - name: buying_type
        sql: buying_type
        type: string

      - name: optimization_goal
        sql: optimization_goal
        type: string

      - name: attribution_setting
        sql: attribution_setting
        type: string

      # Meta quality diagnostic dimensions
      - name: quality_ranking
        sql: quality_ranking
        type: string

      - name: conversion_rate_ranking
        sql: conversion_rate_ranking
        type: string

      - name: engagement_rate_ranking
        sql: engagement_rate_ranking
        type: string

    measures:
      # Core delivery & spend
      - name: spend
        sql: spend
        type: sum

      - name: impressions
        sql: impressions
        type: sum

      - name: reach
        sql: reach
        type: sum

      - name: full_view_impressions
        sql: full_view_impressions
        type: sum

      - name: full_view_reach
        sql: full_view_reach
        type: sum

      # Clicks & standard engagement
      - name: clicks
        sql: clicks
        type: sum

      - name: unique_clicks
        sql: unique_clicks
        type: sum

      - name: link_clicks
        sql: link_clicks
        type: sum

      - name: inline_link_clicks
        sql: inline_link_clicks
        type: sum

      - name: unique_inline_link_clicks
        sql: unique_inline_link_clicks
        type: sum

      - name: unique_outbound_clicks
        sql: unique_outbound_clicks
        type: sum

      - name: page_engagements
        sql: page_engagements
        type: sum

      - name: post_engagements
        sql: post_engagements
        type: sum

      - name: inline_post_engagement
        sql: inline_post_engagement
        type: sum

      - name: post_interactions_gross
        sql: post_interactions_gross
        type: sum

      - name: post_interactions_net
        sql: post_interactions_net
        type: sum

      - name: post_reactions
        sql: post_reactions
        type: sum

      - name: comments
        sql: comments
        type: sum

      # Video performance & instant experience
      - name: video_views
        sql: video_views
        type: sum

      - name: video_play_actions
        sql: video_play_actions
        type: sum

      - name: video_15_sec_watched_actions
        sql: video_15_sec_watched_actions
        type: sum

      - name: video_30_sec_watched_actions
        sql: video_30_sec_watched_actions
        type: sum

      - name: video_p25_watched_actions
        sql: video_p25_watched_actions
        type: sum

      - name: video_p50_watched_actions
        sql: video_p50_watched_actions
        type: sum

      - name: video_p75_watched_actions
        sql: video_p75_watched_actions
        type: sum

      - name: video_p95_watched_actions
        sql: video_p95_watched_actions
        type: sum

      - name: video_p100_watched_actions
        sql: video_p100_watched_actions
        type: sum

      - name: instant_experience_clicks_to_open
        sql: instant_experience_clicks_to_open
        type: sum

      - name: instant_experience_clicks_to_start
        sql: instant_experience_clicks_to_start
        type: sum

      # Downstream mobile/store conversions
      - name: installs
        sql: mobile_app_installs
        type: sum

      - name: app_store_visits
        sql: app_store_visits
        type: sum

      # Calculated measures (rates & performance)
      - name: frequency
        sql: "CASE WHEN {reach} > 0 THEN 1.0 * {impressions} / {reach} ELSE 0 END"
        type: number

      - name: click_through_rate
        title: "CTR"
        sql: "CASE WHEN {impressions} > 0 THEN 1.0 * {clicks} / {impressions} ELSE 0 END"
        type: number

      - name: link_click_through_rate
        title: "Link CTR"
        sql: "CASE WHEN {impressions} > 0 THEN 1.0 * {link_clicks} / {impressions} ELSE 0 END"
        type: number

      - name: install_rate
        title: "Install CVR"
        sql: "CASE WHEN {link_clicks} > 0 THEN 1.0 * {installs} / {link_clicks} ELSE 0 END"
        type: number

      - name: cost_per_click
        title: "Cost per Click"
        sql: "CASE WHEN {clicks} > 0 THEN 1.0 * {spend} / {clicks} ELSE 0 END"
        type: number

      - name: cost_per_link_click
        title: "Cost per Link Click"
        sql: "CASE WHEN {link_clicks} > 0 THEN 1.0 * {spend} / {link_clicks} ELSE 0 END"
        type: number

      - name: cost_per_install
        title: "Cost per Install"
        sql: "CASE WHEN {installs} > 0 THEN 1.0 * {spend} / {installs} ELSE 0 END"
        type: number

      - name: video_p25_completion_rate
        title: "25% Video Completion Rate"
        sql: "CASE WHEN {video_play_actions} > 0 THEN 1.0 * {video_p25_watched_actions} / {video_play_actions} ELSE 0 END"
        type: number

      - name: video_p50_completion_rate
        title: "50% Video Completion Rate"
        sql: "CASE WHEN {video_play_actions} > 0 THEN 1.0 * {video_p50_watched_actions} / {video_play_actions} ELSE 0 END"
        type: number

      - name: video_p75_completion_rate
        title: "75% Video Completion Rate"
        sql: "CASE WHEN {video_play_actions} > 0 THEN 1.0 * {video_p75_watched_actions} / {video_play_actions} ELSE 0 END"
        type: number

      - name: video_p95_completion_rate
        title: "95% Video Completion Rate"
        sql: "CASE WHEN {video_play_actions} > 0 THEN 1.0 * {video_p95_watched_actions} / {video_play_actions} ELSE 0 END"
        type: number

      - name: video_p100_completion_rate
        title: "100% Video Completion Rate"
        sql: "CASE WHEN {video_play_actions} > 0 THEN 1.0 * {video_p100_watched_actions} / {video_play_actions} ELSE 0 END"
        type: number

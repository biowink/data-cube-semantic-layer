cubes:
  - name: crm_sales
    sql_table: airbyte.backend_crm_promo_sales
    data_source: default
    public: false

    dimensions:
      - name: _pk
        sql: "CONCAT(COALESCE({CUBE}.name, ''), '-', CAST({CUBE}.start_time AS VARCHAR), '-', CAST({CUBE}.end_time AS VARCHAR))"
        type: string
        primary_key: true

      - name: sale_name
        sql: "COALESCE({CUBE}.name, 'Non Sale Period')"
        type: string

      - name: start_time
        sql: "{CUBE}.start_time"
        type: time

      - name: end_time
        sql: "{CUBE}.end_time"
        type: time

      - name: sale_period
        sql: "({CUBE}.name IS NOT NULL)"
        type: boolean

    measures:
      - name: sale_started_date
        sql: "{CUBE}.start_time"
        type: min


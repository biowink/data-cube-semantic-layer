cubes:
  - name: market_mapping
    sql_table: core.countries
    description: "Migrated from views/market_mapping.view.lkml"
    public: false

    dimensions:
      # Not a primary key in the source LookML, but Cube needs one on the "one"
      # side of a many_to_one join. iso_alpha_2 is one row per country.
      - name: country_code
        sql: iso_alpha_2
        type: string
        primary_key: true

      - name: country
        sql: country_name
        type: string

      - name: market
        sql: "COALESCE({CUBE}.market, 'Missing Country Data')"
        type: string

      - name: region
        sql: "COALESCE({CUBE}.region, 'Missing Country Data')"
        type: string

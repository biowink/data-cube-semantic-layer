cubes:
  - name: market_mapping
    sql_table: core.countries
    description: "Migrated from market_mapping.view.lkml"

    dimensions:
      # no primary key declared in the source LookML view; country_name is the
      # natural unique key of this country/market/region mapping table
      - name: country
        sql: country_name
        type: string
        primary_key: true

      - name: market
        sql: "COALESCE({CUBE}.market, 'Missing Country Data')"
        type: string

      - name: region
        sql: "COALESCE({CUBE}.region, 'Missing Country Data')"
        type: string
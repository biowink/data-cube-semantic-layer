cubes:
  - name: user_last_properties
    sql_table: user_metrics.user_last_session_attributes
    description: "Migrated from views/users/user_last_properties.view.lkml"

    joins:
      - name: market_mapping
        relationship: many_to_one
        sql: "{CUBE.country} = {market_mapping.country}"

    dimensions:
      - name: analytics_id
        sql: analytics_id
        type: string
        primary_key: true
        public: false

      # dimension_group: last_session -> base time dim + the two timeframes Cube
      # can't derive at query time (day_of_year/day_of_week)
      - name: last_session_ts
        sql: session_ts
        type: time

      - name: last_session_day_of_week
        sql: "date_format({CUBE}.session_ts, '%A')"
        type: string

      - name: last_session_day_of_year
        sql: "day_of_year({CUBE}.session_ts)"
        type: number

      - name: platform
        sql: platform
        type: string

      - name: mode
        sql: mode
        type: string

      # dimension: product_tier / is_subscribed were commented out in the source LookML - not carried over

      - name: app_version
        sql: app_version
        type: string

      - name: major_app_version
        sql: major_app_version
        type: number

      - name: minor_app_version
        sql: minor_app_version
        type: number

      - name: country
        sql: country_name
        type: string

      - name: country_code
        sql: country_code
        type: string

      - name: state
        sql: region_name
        type: string

      - name: market
        sql: >
          CASE
            WHEN {CUBE.country} = 'United States' THEN 'US'
            WHEN {CUBE.country} IN (
              'Austria', 'Belgium', 'Denmark', 'France',
              'Germany', 'Ireland', 'Luxembourg', 'Netherlands',
              'Norway', 'Sweden', 'Switzerland', 'United Kingdom', 'Italy', 'Spain',
              'Australia', 'Canada', 'Japan', 'New Zealand'
            ) THEN 'Non-US Strategic'
            WHEN {CUBE.country} IS NULL THEN 'Missing Country Data'
            ELSE 'Rest of World'
          END
        type: string

      - name: device_manufacturer
        sql: device_manufacturer
        type: string
        meta:
          group_label: "Device Info"

      - name: device_model
        sql: device_model
        type: string
        meta:
          group_label: "Device Info"

      - name: grouped_device_model
        sql: >
          CONCAT(CONCAT({CUBE}.device_manufacturer, ' - '),
            CASE WHEN {CUBE}.device_model LIKE 'SM-%'
              THEN CONCAT('Galaxy ', SUBSTR({CUBE}.device_model, 4, 3))
              ELSE {CUBE}.device_model
            END)
        type: string
        meta:
          group_label: "Device Info"

      - name: locale
        sql: locale
        type: string
        meta:
          group_label: "Language"

      - name: language
        sql: language
        type: string
        meta:
          group_label: "Language"

      - name: is_language_localised
        sql: >
          {CUBE.language} IN ('English', 'Chinese', 'Danish', 'Dutch; Flemish', 'French',
            'German', 'Hindi', 'Indonesian', 'Italian', 'Japanese', 'Norwegian',
            'Norwegian Nynorsk; Nynorsk, Norwegian', 'Bokmål, Norwegian; Norwegian Bokmål',
            'Polish', 'Portuguese', 'Russian', 'Spanish; Castilian', 'Swedish', 'Thai',
            'Turkish', 'Vietnamese', 'Arabic', 'Malay', 'Romanian; Moldavian; Moldovan',
            'Greek, Modern (1453-)', 'Swahili', 'Ukrainian', 'Hungarian')
        type: boolean
        description: "Whether a user's language is one of existing Clue localisation languages"
        meta:
          group_label: "Language"

      - name: localisation_language
        sql: >
          CASE WHEN {CUBE.is_language_localised}
            THEN CASE WHEN {CUBE.language} IN ('Norwegian Nynorsk; Nynorsk, Norwegian', 'Bokmål, Norwegian; Norwegian Bokmål')
                   THEN 'Norwegian'
                   ELSE {CUBE.language}
                 END
            ELSE 'Other'
          END
        type: string
        description: "The existing Clue localised languages, with other languages grouped as Other"
        meta:
          group_label: "Language"

      - name: os_version
        sql: os_version
        type: string
        title: "OS Version"
        meta:
          group_label: "OS Version"

      - name: major_os_version
        sql: "CAST(SPLIT_PART({CUBE}.os_version, '.', 1) AS INTEGER)"
        type: number
        meta:
          group_label: "OS Version"

      - name: minor_os_version
        sql: "CAST(SPLIT_PART({CUBE}.os_version, '.', 2) AS INTEGER)"
        type: number
        meta:
          group_label: "OS Version"